<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de condomínio — Residencial Renoir</title>
<style>
:root {
  color-scheme: light dark;
  --site-primary: #173F45;
  --site-on-primary: #FFFFFF;
  --site-secondary: #DCEBE6;
  --site-on-secondary: #173F45;
  --site-background: #F3F6F4;
  --site-on-background: #182421;
  --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-font-heading: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --surface: light-dark(#FFFFFF, #202A28);
  --surface-soft: light-dark(#EDF3F0, #273431);
  --text: light-dark(#182421, #F0F5F2);
  --muted: light-dark(#61716B, #B3C1BA);
  --border: light-dark(#D7E1DC, #42534D);
  --good: light-dark(#176B49, #70D5A5);
  --bad: light-dark(#A23E32, #FF9D8F);
  --terceirizado: #C18B3C;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); }
#app { min-height: 100vh; width: 100%; }
.hero { background: var(--site-primary); color: var(--site-on-primary); padding: 34px max(22px, calc((100vw - 920px) / 2)); }
.eyebrow { text-transform: uppercase; letter-spacing: .13em; font-size: 11px; font-weight: 750; opacity: .78; }
h1 { font-family: var(--site-font-heading); font-size: 32px; line-height: 1.12; margin: 10px 0 9px; letter-spacing: -.035em; }
.hero p { max-width: 650px; margin: 0; color: #DCEBE6; line-height: 1.55; font-size: 14px; }
main { max-width: 920px; margin: 0 auto; padding: 26px 20px 42px; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: 0 8px 28px rgba(15,45,35,.055); }
.panel h2 { font-size: 18px; margin: 0 0 5px; letter-spacing: -.02em; }
.sub { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 20px; }

/* Grid atualizado para 3 colunas */
.fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 7px; color: var(--muted); }
input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; font: inherit; font-size: 16px; background: var(--surface); color: var(--text); outline: none; }
input:focus { border-color: var(--site-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--site-primary) 16%, transparent); }
.hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

.result { margin-top: 20px; background: var(--site-secondary); color: var(--site-on-secondary); border-radius: 14px; padding: 20px; }
.result-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.result small { opacity: .75; font-weight: 700; }
.amount { font-size: clamp(30px, 6vw, 42px); font-weight: 800; letter-spacing: -.045em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.tag { border: 1px solid color-mix(in srgb, var(--site-on-secondary) 24%, transparent); border-radius: 999px; padding: 7px 10px; font-size: 11px; font-weight: 750; }

.breakdown { margin-top: 18px; padding-top: 16px; border-top: 1px solid color-mix(in srgb, var(--site-on-secondary) 15%, transparent); display: grid; gap: 6px; font-size: 13px; opacity: 0.9; }
.breakdown-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.breakdown-row strong { font-variant-numeric: tabular-nums; }
.breakdown-divider { height: 1px; background: color-mix(in srgb, var(--site-on-secondary) 15%, transparent); margin: 6px 0; }

.comparison { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px; min-width: 0; }
.metric span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; margin-bottom: 5px; }
.metric strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.positive { color: var(--bad); }
.negative { color: var(--good); }

.terceirizado-box { margin-top: 14px; border: 1px solid var(--terceirizado); background: color-mix(in srgb, var(--terceirizado) 8%, transparent); border-radius: 12px; padding: 16px; }
.terceirizado-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
.terceirizado-header span { font-weight: 700; color: var(--text); }
.terceirizado-header strong { font-weight: 800; color: var(--terceirizado); }
.terceirizado-bar { height: 8px; background: color-mix(in srgb, var(--terceirizado) 20%, transparent); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
.terceirizado-fill { height: 100%; background: var(--terceirizado); transition: width 0.3s ease; }
.terceirizado-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.terceirizado-desc strong { color: var(--text); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }

.note { border-left: 3px solid #C18B3C; padding: 10px 13px; background: var(--surface-soft); color: var(--text); border-radius: 0 9px 9px 0; font-size: 12px; line-height: 1.55; margin-top: 18px; }
.details { margin-top: 18px; }
details { border-top: 1px solid var(--border); padding: 14px 0; }
summary { cursor: pointer; font-weight: 750; font-size: 13px; }
.detail-body { color: var(--muted); font-size: 12px; line-height: 1.65; padding-top: 10px; }
.detail-body ul { padding-left: 18px; }
.footer { color: var(--muted); font-size: 11px; line-height: 1.6; text-align: center; margin: 18px 8px 0; }

@media (max-width: 700px) { 
  .fields { grid-template-columns: 1fr; } 
  .comparison { grid-template-columns: 1fr; } 
  .hero { padding: 28px 22px; } 
  h1 { font-size: 27px; } 
  main { padding: 18px 12px 30px; } 
  .panel { padding: 17px; } 
  .terceirizado-header { flex-direction: column; align-items: flex-start; gap: 4px; }
}
@media (prefers-color-scheme: dark) { .hero p { color: #DCEBE6; } }
</style>
</head>
